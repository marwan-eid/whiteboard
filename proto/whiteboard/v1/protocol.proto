syntax = "proto3";

package whiteboard.v1;

// Wire protocol between browser/loadgen clients and a board node.
// Every WebSocket binary frame carries exactly one ClientMessage or ServerMessage.
// See docs/ARCHITECTURE.md and docs/decisions/0001-sync-model.md.
//
// 64-bit ids, seqs and times stay below 2^53, so the web client converts
// them to JS numbers exactly (protobuf-es generates bigint for them).

message ClientMessage {
  oneof msg {
    Hello hello = 1;
    TimePing time_ping = 2;
    OpBatch op_batch = 3;
    Cursor cursor = 4;
    Viewport viewport = 5;
    HistoryRequest history = 6;
    RestoreRequest restore = 7;
  }
}

message ServerMessage {
  oneof msg {
    Welcome welcome = 1;
    TimePong time_pong = 2;
    ServerError error = 3;
    Frame frame = 4;
    History history = 5;
  }
}

// First message on every connection.
message Hello {
  uint32 protocol_version = 1;
  string board_id = 2;
  // Random per client session, in [1, 2^53). Objects this client creates
  // have ids prefixed with its base-36 form (see ObjectIdPrefix).
  uint64 client_id = 3;
  // The region to receive; unset means the whole board.
  Viewport viewport = 4;
  // Signed guest identity from POST /api/guest (optional for public boards).
  string guest_token = 5;
  // A share link's token, for private boards.
  string share_token = 6;
}

message Welcome {
  uint32 protocol_version = 1;
  string node_id = 2;
  int64 server_time_ms = 3;
  // The board as of seq, limited to the Hello viewport. Frames that follow
  // carry batches with higher seqs.
  uint64 seq = 4;
  repeated ObjectState objects = 5;
  // Highest OpBatch.client_seq already applied for this client_id, so a
  // reconnecting client knows which pending batches to drop and which to resend.
  uint64 last_client_seq = 6;
  // Clients on the board, including this one.
  uint32 online = 7;
  // What this client may do; viewers cannot edit or restore.
  Role role = 8;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_VIEWER = 1;
  ROLE_EDITOR = 2;
  ROLE_OWNER = 3;
}

// Clock-offset and RTT probe. The server echoes t0 and adds its own clock.
message TimePing {
  double t0 = 1;
}

message TimePong {
  double t0 = 1;
  int64 server_time_ms = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_BAD_REQUEST = 1;
  ERROR_CODE_UNSUPPORTED_VERSION = 2;
  // Another live connection on this board uses the same client_id.
  ERROR_CODE_CLIENT_ID_IN_USE = 3;
  // No access to this board (private, or the share link was revoked).
  ERROR_CODE_FORBIDDEN = 4;
}

message ServerError {
  ErrorCode code = 1;
  string message = 2;
}

// ---------------------------------------------------------------------------
// Board model. An object is a map of properties; each property is a
// last-writer-wins register ordered by Stamp. Creating, editing and deleting
// are all "set these properties" (deleting sets deleted = true).

// Hybrid logical clock timestamp, totally ordered by (wall_ms, counter, client_id).
message Stamp {
  int64 wall_ms = 1;
  uint32 counter = 2;
  uint64 client_id = 3;
}

enum ShapeType {
  SHAPE_TYPE_UNSPECIFIED = 0;
  SHAPE_TYPE_RECT = 1;
  SHAPE_TYPE_ELLIPSE = 2;
  SHAPE_TYPE_STICKY = 3;
  SHAPE_TYPE_TEXT = 4;
  SHAPE_TYPE_ARROW = 5;
  SHAPE_TYPE_FREEHAND = 6;
}

// Field numbers must stay below 32: FieldStamps uses them as bit positions.
message ObjectProps {
  // Set once, when the object is created.
  optional ShapeType type = 1;
  optional bool deleted = 2;
  optional double x = 3;
  optional double y = 4;
  optional double w = 5;
  optional double h = 6;
  // Fractional index; objects render in (z, id) order.
  optional string z = 7;
  // 0xRRGGBBAA.
  optional uint32 fill = 8;
  optional uint32 stroke = 9;
  optional float stroke_width = 10;
  optional string text = 11;
  // Freehand strokes and arrows: points relative to (x, y), as zigzag-varint
  // deltas of integer (dx, dy) pairs (see web/src/canvas/geometry.ts).
  optional bytes points = 12;
  // Arrow ends attached to other objects; an empty object_id means unattached.
  optional Binding from = 13;
  optional Binding to = 14;
  optional float font_size = 15;
}

// Where an arrow end attaches: a point on the target's bounding box, as
// fractions of its width and height (0.5, 0.5 is the center).
message Binding {
  string object_id = 1;
  float anchor_x = 2;
  float anchor_y = 3;
}

// Sets every property present in props, all with the batch's stamp.
// An op on an unknown id creates the object and must set type.
message Op {
  string id = 1;
  ObjectProps props = 2;
}

// One user action (e.g. dragging three shapes), applied atomically.
message OpBatch {
  // Per client, starting at 1 and increasing by 1.
  uint64 client_seq = 1;
  // client_id is ignored; the server uses the connection's.
  Stamp stamp = 2;
  repeated Op ops = 3;
}

// A batch as ordered by the board. stamp.client_id is the origin client.
message SequencedBatch {
  uint64 seq = 1;
  Stamp stamp = 2;
  repeated Op ops = 3;
}

message Ack {
  uint64 client_seq = 1;
  // Zero when rejected.
  uint64 seq = 2;
  // The stamp the batch was applied with. It differs from the one sent only
  // if the server clamped a stamp too far in the future; the client must then resync.
  Stamp stamp = 3;
  // The batch failed validation and was not applied; the client must resync.
  bool rejected = 4;
  string reason = 5;
}

// Everything a client needs from one board tick: other clients' batches, in
// seq order, and acks for its own.
message Frame {
  repeated SequencedBatch batches = 1;
  repeated Ack acks = 2;
  // Other clients' cursors that moved, or left this client's view, since the last frame.
  repeated CursorUpdate cursors = 3;
  // Objects that came into this client's viewport (by an edit or by the
  // viewport moving), in full; merge them like any other state.
  repeated ObjectState objects = 4;
  // Clients on the board, including this one; set when it changed.
  optional uint32 online = 5;
  // The board seq as of this frame; the client has now seen every change up
  // to it that concerns its viewport.
  uint64 seq = 6;
  // Objects that left this client's viewport (or were deleted); drop them.
  // The server decides what each client holds; clients never evict on their own.
  repeated string leave = 7;
}

// The board region a client receives: its visible area plus a margin.
// The server sends edits only for objects in it, and when lod is set only
// the properties needed to draw boxes (for zoomed-out views).
message Viewport {
  double x = 1;
  double y = 2;
  double w = 3;
  double h = 4;
  bool lod = 5;
}

// Presence: the sender's pointer in board coordinates. Not persisted.
message Cursor {
  double x = 1;
  double y = 2;
}

message CursorUpdate {
  uint64 client_id = 1;
  double x = 2;
  double y = 3;
  // The client left; remove its cursor.
  bool gone = 4;
}

message ObjectState {
  string id = 1;
  ObjectProps props = 2;
  repeated FieldStamps stamps = 3;
}

// The stamp of every property whose field number's bit is set in field_mask.
message FieldStamps {
  Stamp stamp = 1;
  uint32 field_mask = 2;
}

// ---------------------------------------------------------------------------
// History (docs/ARCHITECTURE.md, "History replay and point-in-time restore").

// Asks for the board as it was right after batch seq (0: empty board).
message HistoryRequest {
  uint64 seq = 1;
}

// The board as of seq, limited to the client's viewport.
message History {
  uint64 seq = 1;
  // When the batch at seq was made (0 if unknown).
  int64 wall_ms = 2;
  repeated ObjectState objects = 3;
}

// Makes the board look as it did at seq. The server appends the difference
// as one new batch, so history stays append-only and a restore can itself
// be undone by restoring again.
message RestoreRequest {
  uint64 seq = 1;
}
