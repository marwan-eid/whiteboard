# One command to run everything:  docker compose up --build
# Then open http://localhost:8080
name: whiteboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whiteboard}
      POSTGRES_DB: whiteboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Localhost only: lets `go run ./cmd/whiteboard` use this database in dev.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard -d whiteboard"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Two board nodes (ADR-0005). Each board is served by one node at a time,
  # chosen by lease; Caddy reaches a given node at /n/{node}/ and spreads
  # /ws and /api over both. Add a node by copying node-2 and adding it to
  # deploy/Caddyfile.
  node-1: &node
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    environment: &node-env
      DATABASE_URL: postgres://whiteboard:${POSTGRES_PASSWORD:-whiteboard}@postgres:5432/whiteboard?sslmode=disable
      NODE_ID: node-1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Signs guest tokens; every node must share it. Set your own for anything public: SECRET=... docker compose up
      SECRET: ${SECRET:-dev-only-secret-change-me}
      # The node is reachable only through Caddy, which sets X-Forwarded-For.
      TRUST_PROXY: "true"
      # Open WebSockets per client IP; 0 turns the limit off (load tests from one machine).
      MAX_CONNS_PER_IP: ${MAX_CONNS_PER_IP:-64}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/whiteboard", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  node-2:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: node-2

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      node-1:
        condition: service_healthy
      node-2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
