# One command to run everything:  docker compose up --build
# Then open http://localhost:8080
name: whiteboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whiteboard}
      POSTGRES_DB: whiteboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Localhost only: lets `go run ./cmd/whiteboard` use this database in dev.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard -d whiteboard"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  node-1:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    environment:
      DATABASE_URL: postgres://whiteboard:${POSTGRES_PASSWORD:-whiteboard}@postgres:5432/whiteboard?sslmode=disable
      NODE_ID: node-1
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/whiteboard", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      node-1:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
