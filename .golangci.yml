version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        # Best-effort teardown; the only error is "already closed".
        - (*github.com/coder/websocket.Conn).CloseNow
  exclusions:
    paths:
      - internal/pb
    rules:
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - whiteboard
  exclusions:
    paths:
      - internal/pb
