version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: whiteboard/internal/pb
plugins:
  # Pinned through the `tool` directive in go.mod.
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/pb
    opt: paths=source_relative
  # Pinned through package-lock.json.
  - local: protoc-gen-es
    out: web/src/gen
    opt: target=ts
